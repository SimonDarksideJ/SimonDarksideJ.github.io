name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # zenithmoon.com mirrors these posts under /blogs at build time. This asks it to rebuild
  # once DarkGenesis is live, so a new post appears there too without a second publish.
  # It signs in as a private GitHub App installed only on ZenithMoon.Website. The app's key
  # does not expire, and each run gets a token that lasts an hour and can only touch that repo.
  # Needs the ZENITHMOON_APP_CLIENT_ID variable and the ZENITHMOON_APP_PRIVATE_KEY secret.
  # The job is skipped until the variable exists.
  notify-zenithmoon:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.ZENITHMOON_APP_CLIENT_ID != '' }}
    permissions: {}
    steps:
      - name: Get a token for ZenithMoon.Website
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ZENITHMOON_APP_CLIENT_ID }}
          private-key: ${{ secrets.ZENITHMOON_APP_PRIVATE_KEY }}
          owner: SimonDarksideJ
          repositories: ZenithMoon.Website
          permission-contents: write

      - name: Ask zenithmoon.com to rebuild its blog mirror
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/SimonDarksideJ/ZenithMoon.Website/dispatches -f event_type=blog-updated
          echo "Requested a rebuild of zenithmoon.com for $GITHUB_SHA."
