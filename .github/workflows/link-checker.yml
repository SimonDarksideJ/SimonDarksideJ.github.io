name: Check Links

on:
  pull_request:
    paths:
      - '**.md'
      - '**.markdown'
      - '_posts/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          
      - name: Build site
        run: bundle exec jekyll build
        
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Some sites (e.g. LinkedIn) rate-limit or block automated link checks.
          # Reduce concurrency + add retries, and treat 429 as non-fatal to avoid false negatives.
          args: >-
            --verbose --no-progress
            --exclude-mail
            --timeout 30
            --max-concurrency 2
            --max-retries 3
            --retry-wait-time 2
            --accept 200,204,206,429
            --root-dir ${{ github.workspace }}/_site
            --cache --max-cache-age 1d
            '_site/**/*.html'
          jobSummary: true
          # Not failing for now: about 865 links to retired hosts are not fixed yet (WP8).
          # Set this back to true once WP8 is done.
          fail: false
